<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alone.Online</title>

<style>
  body {
    background: #000;
    font-family: monospace;
    margin: 0;
    overflow: hidden;
  }

  /* MENU */
  #menu {
    text-align: center;
    margin-top: 20vh;
  }

  .btn {
    display: block;
    width: 200px;
    padding: 12px;
    margin: 12px auto;
    background: #111;
    color: #fff;
    border: 2px solid #333;
    border-radius: 6px;
    font-size: 1.3em;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
  }

  .btn:hover::before {
    content: ">>>";
    position: absolute;
    left: -60px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-weight: bold;
    opacity: 0.9;
  }

  .btn:hover {
    background: #222;
    transform: scale(1.05);
  }

  /* SCENE */
  #scene {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #000;
  }

  #background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  #sprite {
    position: absolute;
    left: 50%;
    top: 35%;
    transform: translateX(-50%);
    width: 300px;
  }

  #dialogueBox {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: #000;
    border-top: 2px solid #444;
    padding: 20px;
    color: #fff;
    font-size: 1.2em;
  }

  #speaker {
    color: #ff6b6b;
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
  <button class="btn" id="playBtn">Play</button>
  <button class="btn">Settings</button>
  <button class="btn">Exit</button>
</div>

<!-- SCENE -->
<div id="scene">
  <img id="background" src="">
  <img id="sprite" src="">
  <div id="dialogueBox">
    <span id="speaker">YOU</span>: <span id="dialogueText">...</span>
  </div>
</div>

<script>
  const menu = document.getElementById("menu");
  const scene = document.getElementById("scene");
  const sprite = document.getElementById("sprite");
  const background = document.getElementById("background");
  const speaker = document.getElementById("speaker");
  const dialogueText = document.getElementById("dialogueText");

  // --- WAKE UP SCENE USING YOUR IMAGES ---
  const wakeUpScene = [
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SLEEP_BASE64",
      speaker: "Narrator",
      text: "..."
    },
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SLEEP_BASE64",
      speaker: "Narrator",
      text: "A faint hum fills the room."
    },
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SLEEP_BASE64",
      speaker: "Narrator",
      text: "PixelIvie stirs in her sleep..."
    },
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SIT_BASE64",
      speaker: "Ivie",
      text: "Mmnh...?"
    },
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SIT_BASE64",
      speaker: "Narrator",
      text: "She slowly opens her eyes."
    },
    {
      bg: "PASTE_ROOM_BASE64",
      sprite: "PASTE_IVIE_SIT_BASE64",
      speaker: "Ivie",
      text: "Where... am I?"
    }
  ];

  let wakeIndex = 0;

  function startWakeUpScene() {
    menu.style.display = "none";
    scene.style.display = "block";
    wakeIndex = 0;
    showWakeFrame();
  }

  function showWakeFrame() {
    const frame = wakeUpScene[wakeIndex];

    background.src = frame.bg;
    sprite.src = frame.sprite;
    speaker.textContent = frame.speaker;
    dialogueText.textContent = frame.text;

    wakeIndex++;
    if (wakeIndex >= wakeUpScene.length) {
      wakeIndex = wakeUpScene.length - 1;
    }
  }

  // Click to advance wake-up scene
  scene.onclick = showWakeFrame;

  // Replace Play button action
  document.getElementById("playBtn").onclick = startWakeUpScene;
</script>

</body>
</html>
