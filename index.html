<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alone.Online</title>

<style>
  body {
    background: #000;
    font-family: monospace;
    margin: 0;
    overflow: hidden;
  }

  /* MENU */
  #menu {
    text-align: center;
    margin-top: 20vh;
  }

  .btn {
    display: block;
    width: 200px;
    padding: 12px;
    margin: 12px auto;
    background: #111;
    color: #fff;
    border: 2px solid #333;
    border-radius: 6px;
    font-size: 1.3em;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
  }

  .btn:hover::before {
    content: ">>>";
    position: absolute;
    left: -60px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-weight: bold;
    opacity: 0.9;
  }

  .btn:hover {
    background: #222;
    transform: scale(1.05);
  }

  /* SCENE */
  #scene {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #000;
  }

  #background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: -1;
  }

  #sprite {
    position: absolute;
    left: 50%;
    top: 35%;
    transform: translateX(-50%);
    width: 300px;
  }

  #dialogueBox {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: #000;
    border-top: 2px solid #444;
    padding: 20px;
    color: #fff;
    font-size: 1.2em;
  }

  #speaker {
    color: #ff6b6b;
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
  <button class="btn" id="playBtn">Play</button>
  <button class="btn">Settings</button>
  <button class="btn">Exit</button>
</div>

<!-- SCENE -->
<div id="scene">
  <img id="background" src="">
  <img id="sprite" src="">
  <div id="dialogueBox">
    <span id="speaker">YOU</span>: <span id="dialogueText">...</span>
  </div>
</div>
