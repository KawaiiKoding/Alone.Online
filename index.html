<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alone.Online</title>

<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* --- STAGE --- */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- CIRCLE IVIE (MOOD SCENE) --- */
  #circleIvie {
    width: 220px;
    height: 220px;
    border-radius: 999px;
    background: #202020;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #circleIvieFace {
    width: 140px;
    height: 140px;
    border-radius: 999px;
    background: #f5c7a8;
    position: relative;
  }

  .eye {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #000;
    top: 45px;
  }
  .eye.left { left: 35px; }
  .eye.right { right: 35px; }

  .mouth {
    position: absolute;
    width: 60px;
    height: 30px;
    border-radius: 0 0 60px 60px;
    background: #ff3b3b;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Sleep state */
  .sleep .eye {
    height: 6px;
    top: 55px;
  }
  .sleep .mouth {
    height: 10px;
    background: #000;
  }
  .sleep {
    opacity: 0.7;
    transform: translateY(40px) scale(0.9);
  }

  /* Sit state */
  .sit {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Room aura */
  .roomAura {
    filter: drop-shadow(0 0 80px rgba(120,180,255,0.4));
  }

  /* Mood text */
  #mood {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    color: #fff;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  /* --- PIXEL ROOM SCENE --- */
  #pixelScene {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1s ease;
  }

  #roomBG {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #pixelIvie {
    position: absolute;
    width: 300px;
    image-rendering: pixelated;
    left: 50%;
    top: 60%;
    transform: translate(-50%, -50%);
    transition: opacity 0.6s ease;
  }
</style>
</head>

<body>
<div id="stage">

  <!-- Mood Scene -->
  <div id="circleIvie" class="sleep">
    <div id="circleIvieFace">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div id="mood">You Woke Up Happy</div>

  <!-- Pixel Scene -->
  <div id="pixelScene">
    <img id="roomBG" src="ROOM_BASE64_HERE">
    <img id="pixelIvie" src="SLEEP_BASE64_HERE">
  </div>

</div>

<script>
  const circle = document.getElementById('circleIvie');
  const mood = document.getElementById('mood');
  const pixelScene = document.getElementById('pixelScene');
  const pixelIvie = document.getElementById('pixelIvie');

  /* Circle Ivie animation */
  setTimeout(() => circle.className = "sit", 1200);
  setTimeout(() => circle.className = "sit roomAura", 2400);
  setTimeout(() => mood.style.opacity = 1, 3600);

  /* Transition to pixel scene */
  setTimeout(() => {
    circle.style.opacity = 0;
    mood.style.opacity = 0;
  }, 5200);

  setTimeout(() => {
    pixelScene.style.opacity = 1;
  }, 6200);

  /* Pixel Ivie wakes up */
  setTimeout(() => {
    pixelIvie.src = "SIT_BASE64_HERE";
  }, 7600);
</script>

</body>
</html>
