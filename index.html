<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ivie – Summer’s Over</title>
<style>
  body {
    margin: 0;
    background: #000000; /* EXACT black bg */
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000000; /* keep it solid black */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ivie {
    width: 220px;
    height: 220px;
    border-radius: 999px;
    background: #202020;
    position: relative;
    box-shadow: 0 0 40px rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }

  .ivie-face {
    width: 140px;
    height: 140px;
    border-radius: 999px;
    background: #f5c7a8;
    position: relative;
  }

  .ivie-eye {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #000;
    top: 45px;
  }
  .ivie-eye.left { left: 35px; }
  .ivie-eye.right { right: 35px; }

  .ivie-mouth {
    position: absolute;
    width: 60px;
    height: 30px;
    border-radius: 0 0 60px 60px;
    background: #ff3b3b;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* States */
  .sleep {
    transform: translateY(40px) scale(0.9);
    opacity: 0.7;
  }
  .sleep .ivie-eye {
    height: 6px;
    top: 55px;
    border-radius: 999px;
  }
  .sleep .ivie-mouth {
    height: 10px;
    background: #000;
  }

  .sit {
    transform: translateY(0) scale(1);
    opacity: 0.9;
  }

  .room {
    box-shadow: 0 0 80px rgba(120,180,255,0.4);
  }

  .shocked .ivie-eye {
    width: 30px;
    height: 30px;
    background: #ffffff;
    border: 4px solid #000;
  }
  .shocked .ivie-mouth {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: #ff3b3b;
  }

  /* Dialogue box */
  #dialogue {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 18px;
    border-radius: 8px;
    background: rgba(0,0,0,0.8);
    border: 2px solid #ff4b4b;
    color: #ffffff;
    font-size: 18px;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #dialogue span.name {
    color: #ff4b4b;
    font-weight: 700;
    margin-right: 6px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ivie" class="ivie sleep">
    <div class="ivie-face">
      <div class="ivie-eye left"></div>
      <div class="ivie-eye right"></div>
      <div class="ivie-mouth"></div>
    </div>
  </div>

  <div id="dialogue">
    <span class="name">Ivie:</span>
    <span class="line">Summer's over already!?</span>
  </div>
</div>

<script>
  // Sequence: Sleep -> Sit -> Room -> Shocked + dialogue
  const ivie = document.getElementById('ivie');
  const dialogue = document.getElementById('dialogue');

  function setState(classes) {
    ivie.className = 'ivie ' + classes.join(' ');
  }

  // Sleep (already set)
  setTimeout(() => {
    // Sit
    setState(['sit']);
  }, 1200);

  setTimeout(() => {
    // Room (same bg, just aura)
    setState(['sit', 'room']);
  }, 2400);

  setTimeout(() => {
    // Shocked Ivie in room
    setState(['room', 'shocked']);
    dialogue.style.opacity = '1';
  }, 3600);
</script>
</body>
</html>
