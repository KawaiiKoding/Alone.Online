<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alone.Online</title>

<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #ivie {
    width: 260px;
    image-rendering: pixelated;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  /* STATES */
  .sleep {
    opacity: 0.7;
    transform: scale(0.9) translateY(20px);
  }

  .sit {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .room {
    filter: drop-shadow(0 0 20px #7ab8ff);
  }

  .shocked {
    filter: drop-shadow(0 0 30px #ff4b4b);
  }

  /* Dialogue */
  #dialogue {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 2px solid #ff4b4b;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 20px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #dialogue .name {
    color: #ff4b4b;
    font-weight: bold;
  }
</style>
</head>

<body>
<div id="stage">

  <!-- YOUR PIXEL IVIE SPRITE -->
  <img id="ivie" class="sleep"
       src="data:image/png;base64,PASTE_YOUR_PIXEL_IVIE_BASE64_HERE">

  <div id="dialogue">
    <span class="name">Ivie:</span>
    <span class="line">Summer's over already!?</span>
  </div>

</div>

<script>
  const ivie = document.getElementById('ivie');
  const dialogue = document.getElementById('dialogue');

  function setState(list) {
    ivie.className = list.join(' ');
  }

  // Sleep → Sit → Room → Shocked + Dialogue
  setTimeout(() => setState(['sit']), 1200);
  setTimeout(() => setState(['sit', 'room']), 2400);
  setTimeout(() => {
    setState(['room', 'shocked']);
    dialogue.style.opacity = 1;
  }, 3600);
</script>

</body>
</html>
