<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* ROOM SCENE */
  #roomScene {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }

  /* ROOM BACKGROUND */
  #roomBG {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* IVIE BASE POSITION */
  .ivieBase {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: auto;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* mood animation */
  .sleep {
    opacity: 0.7;
    transform: translate(-50%, 40px) scale(0.9);
  }

  .sit {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* aura glow */
  .roomAura {
    filter: drop-shadow(0 0 80px rgba(120,180,255,0.4));
  }
</style>
