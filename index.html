<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alone.Online</title>

<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #ivie {
    width: 260px;
    image-rendering: pixelated;
    transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
  }

  /* STATES */
  .sleep {
    opacity: 0.7;
    transform: scale(0.9) translateY(20px);
  }

  .sit {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .room {
    filter: drop-shadow(0 0 20px #7ab8ff);
  }

  /* Mood text */
  #mood {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.6s ease;
    letter-spacing: 0.05em;
  }
</style>
</head>

<body>
<div id="stage">

  <!-- Pixel Ivie -->
  <img id="ivie" class="sleep"
       src="PASTE_YOUR_IVIE_BASE64_HERE">

  <div id="mood">You Woke Up Happy</div>

</div>

<script>
  const ivie = document.getElementById('ivie');
  const mood = document.getElementById('mood');

  function setState(list) {
    ivie.className = list.join(' ');
  }

  // Sleep → Sit → Room → Mood text
  setTimeout(() => setState(['sit']), 1200);
  setTimeout(() => setState(['sit', 'room']), 2400);
  setTimeout(() => {
    mood.style.opacity = 1;
  }, 3600);

  // You can change this text each day:
  // mood.innerText = "You Woke Up Tired";
  // mood.innerText = "You Woke Up Excited";
  // mood.innerText = "You Woke Up Nervous";
</script>

</body>
</html>
